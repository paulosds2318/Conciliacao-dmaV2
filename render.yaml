services:
  - type: web
    name: conciliacao-dma-v2-demo
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    initialDeployHook: node --experimental-strip-types prisma/seed.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conciliacao-dma-v2-db-demo
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: conciliacao-dma-v2-demo
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DOCUMENT_STORAGE_PATH
        value: /app/private-uploads
      - key: MODO_TESTE_API
        value: "true"
      - key: CORAL_CONTRACT_LOOKUP_URL
        value: https://servicescoral.aluguefoco.com.br/api/rentagreement/{CONTRATO}
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: conciliacao-dma-v2-db-demo
    databaseName: conciliacao_dma
    plan: free
    region: ohio
    ipAllowList: []
